name: Validate compact pipeline release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # R is already installed in this image. This avoids a long apt-based R
      # installation and makes the check independent of Ubuntu package mirrors.
      image: rocker/r-ver:4.4.3
    steps:
      - uses: actions/checkout@v5
      - name: Parse scripts and validate packaged library
        run: Rscript tests/smoke_test.R
