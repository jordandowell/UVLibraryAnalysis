name: Validate compact pipeline release

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Parse scripts and validate packaged library
        run: Rscript tests/smoke_test.R
